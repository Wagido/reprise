# Collecte hebdomadaire des comptes (SEC + ESEF) puis publication sur GitHub Pages.
name: Collecte et publication

on:
  schedule:
    - cron: "17 4 * * *"   # chaque jour vers 4 h UTC (les étapes lourdes réutilisent le cache)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Le cache garde les rapports déjà lus et les secteurs SEC d'une semaine sur l'autre.
      - uses: actions/cache@v4
        with:
          path: cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-
      - name: USA (SEC EDGAR)
        env:
          # Facultatif : secret SEC_USER_AGENT (Settings > Secrets and variables > Actions),
          # par exemple « reprise-screener une-adresse@exemple.fr ». Sinon, valeur générique.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'reprise-screener contact@example.com' }}
        run: python collect/sec.py
      - name: France (ESEF)
        run: python collect/esef.py
      - name: Europe et Royaume-Uni (ESEF)
        run: python collect/esef.py --europe
      - name: Grands groupes étrangers cotés à New York
        run: python collect/sec_intl.py
      - name: PME françaises
        run: python collect/pme.py
      - name: Cours de Bourse
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY || secrets.POLYGON_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python collect/prices.py
      - name: Coût du capital (taux, primes de risque, bêtas)
        run: python collect/rates.py || true
      - name: Fusion
        run: python collect/build.py
      - name: Site
        run: |
          mkdir -p _site/data
          cp index.html app.js analyse.js pme.js lbo.js picking.js nuages.js tdb.js style.css sw.js manifest.webmanifest icon.svg _site/
          cp -r lib _site/
          # Version dans les adresses des fichiers : le navigateur reprend les nouveaux à chaque publication.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html
          cp data/companies.json data/pme.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
